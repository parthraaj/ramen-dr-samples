apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: StatefulSet
      name: sts-2
    patch: |-
      - op: replace
        path: /metadata/name
        value: sts-2-writer
      - op: replace
        path: /spec/serviceName
        value: sts-2-writer
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: logger
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - sh
          - -c
          - |
            emit() {
                echo "$(date) $1" | tee -a /data/ramen.log
                sync
            }
            trap "emit STOP; exit" TERM
            emit START
            while true; do
                sleep 10 & wait
                emit UPDATE
            done