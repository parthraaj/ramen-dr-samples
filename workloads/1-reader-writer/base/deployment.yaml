apiVersion: apps/v1
kind: Deployment
metadata:
  name: deploy-template
spec:
  replicas: 1
  selector:
    matchLabels:
      app-key: template
  template:
    metadata:
      labels:
        app-key: template
    spec:
      containers:
        - name: busybox
          image: quay.io/nirsof/busybox:stable
          command: ["tail", "-f", "/dev/null"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-template