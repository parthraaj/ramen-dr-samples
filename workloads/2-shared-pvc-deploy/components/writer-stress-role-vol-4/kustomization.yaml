apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      kind: Deployment
      name: deploy-vol-4
    patch: |-
      - op: replace
        path: /metadata/name
        value: deploy-vol-4-writer-stress
      - op: replace
        path: /spec/replicas
        value: 1
      - op: remove
        path: /spec/template/spec/affinity
      - op: replace
        path: /spec/template/spec/containers/0/name
        value: writer-stress
      - op: replace
        path: /spec/template/spec/containers/0/command
        value:
          - sh
          - -c
          - |
            usage() { df /data | awk 'NR==2 {gsub("%","",$5); print $5}'; }
            emit() {
                echo "$(date) $1" | tee -a /data/ramen.log
                sync
            }
            trap "emit STOP; exit" TERM
            emit START
            i=0
            while true; do
                u=$(usage)
                if [ "$u" -ge 90 ]; then
                    emit "usage ${u}%, cleaning up to 50%"
                    while [ "$u" -ge 50 ]; do
                        oldest=$(ls -tr /data/chunk_*.bin 2>/dev/null | head -1)
                        [ -z "$oldest" ] && break
                        rm -f "$oldest"
                        u=$(usage)
                    done
                    emit "usage now ${u}%"
                fi
                dd if=/dev/zero of=/data/chunk_$i.bin bs=1M count=1024 status=none
                sync
                i=$((i+1))
                emit UPDATE
                sleep 10 & wait
            done